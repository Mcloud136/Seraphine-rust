name: Build Rust app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/app/src-tauri

      - name: Install frontend dependencies
        working-directory: rust/app
        run: npm ci

      - name: Build frontend
        working-directory: rust/app
        run: npm run build

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --release --workspace

      - name: Run Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tauri app tests
        working-directory: rust/app/src-tauri
        run: cargo test