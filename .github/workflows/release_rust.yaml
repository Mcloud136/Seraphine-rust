name: Release Rust app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: wxbns
      GITEE_REPO: seraphine-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/app/src-tauri

      - name: Build release tool
        run: cargo build --release --manifest-path rust/Cargo.toml -p release-tool

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(rust/target/release/release-tool.exe version --config rust/app/src-tauri/tauri.conf.json)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        working-directory: rust
        run: cargo test --release --workspace

      - name: Install frontend dependencies
        working-directory: rust/app
        run: npm ci

      - name: Build signed installer
        working-directory: rust/app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Build Chinese installer
        shell: bash
        env:
          SERAPHINE_INSTALLER_VERSION: ${{ steps.version.outputs.value }}
        run: |
          version="${{ steps.version.outputs.value }}"
          iscc=""
          for candidate in \
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/c/Program Files/Inno Setup 6/ISCC.exe" \
            "/c/Program Files/Inno Setup 7/ISCC.exe"; do
            if [ -f "$candidate" ]; then
              iscc="$candidate"
              break
            fi
          done
          if [ -z "$iscc" ]; then
            choco install innosetup --no-progress -y
            for candidate in \
              "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
              "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              if [ -f "$candidate" ]; then
                iscc="$candidate"
                break
              fi
            done
          fi
          if [ -z "$iscc" ]; then
            echo "ISCC not found"
            exit 1
          fi
          "$iscc" installer/seraphine-rust.iss
          test -f "installer/Output/SeraphineRust-${version}-setup-zh.exe"
          echo "Chinese installer built for $version"

      - name: Build latest.json
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="dry-run"
          fi
          installer="rust/app/src-tauri/target/release/bundle/nsis/Seraphine Rust_${version}_x64-setup.exe"
          test -f "$installer"
          encoded="Seraphine.Rust_${version}_x64-setup.exe"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${encoded}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rust/target/release/release-tool.exe manifest \
            --signature "${installer}.sig" \
            --version "$version" \
            --url "$url" \
            --notes "Seraphine Rust $version" \
            --pub-date "$timestamp" \
            --output latest.json

      - name: Prepare Gitee assets
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="${{ github.ref_name }}"
          installer="rust/app/src-tauri/target/release/bundle/nsis/Seraphine Rust_${version}_x64-setup.exe"
          mkdir -p gitee-assets
          cp "$installer" "gitee-assets/Seraphine.Rust_${version}_x64-setup.exe"
          cp "${installer}.sig" "gitee-assets/Seraphine.Rust_${version}_x64-setup.exe.sig"
          cp "installer/Output/SeraphineRust-${version}-setup-zh.exe" "gitee-assets/"
          cp rust/resources/data/AramBuff.json rust/resources/data/aram-manifest.json "gitee-assets/"
          rust/target/release/release-tool.exe rewrite-manifest \
            --input latest.json \
            --url "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${tag}/Seraphine.Rust_${version}_x64-setup.exe" \
            --output "gitee-assets/latest.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-rust-${{ steps.version.outputs.value }}
          path: |
            rust/app/src-tauri/target/release/bundle/nsis/*.exe
            rust/app/src-tauri/target/release/bundle/nsis/*.sig
            installer/Output/*.exe
            rust/resources/data/AramBuff.json
            rust/resources/data/aram-manifest.json
            latest.json
            gitee-assets/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Seraphine Rust ${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            rust/app/src-tauri/target/release/bundle/nsis/*.exe
            rust/app/src-tauri/target/release/bundle/nsis/*.sig
            installer/Output/*.exe
            rust/resources/data/AramBuff.json
            rust/resources/data/aram-manifest.json
            latest.json

      - name: Publish updater manifest
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: updater
          name: Updater manifest
          body: Tauri updater manifest (latest.json) for the newest application release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: latest.json

      - name: Sync tag to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          remote="https://wxbns:${GITEE_TOKEN}@gitee.com/wxbns/seraphine-rust.git"
          local_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          for attempt in 1 2 3; do
            remote_sha=$(GIT_TERMINAL_PROMPT=0 git ls-remote "$remote" \
              "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
            if [ "$remote_sha" = "$local_sha" ]; then
              echo "Gitee tag already at $local_sha"
              exit 0
            fi
            force=""
            if [ -n "$remote_sha" ]; then
              echo "Moving Gitee tag $remote_sha -> $local_sha"
              force="--force"
            fi
            if GIT_TERMINAL_PROMPT=0 git push $force "$remote" \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "tag sync attempt $attempt failed; retrying"
            sleep 3
          done
          exit 1

      - name: Publish app release to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          rust/target/release/release-tool.exe gitee \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" \
            --tag "$GITHUB_REF_NAME" \
            --release-name "Seraphine Rust ${{ steps.version.outputs.value }}" \
            --release-body "GitHub 构建，Gitee 下载与更新。包含中文 Inno Setup 安装包、自动更新包与 ARAM 数据。" \
            --target main \
            --files gitee-assets/*

      - name: Publish updater manifest to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          rust/target/release/release-tool.exe gitee \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" \
            --tag updater \
            --release-name "Updater manifest" \
            --release-body "Tauri updater manifest (Gitee download)." \
            --target main \
            --files gitee-assets/latest.json

      

      - name: Publish raw updater manifest
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cp gitee-assets/latest.json "$RUNNER_TEMP/latest.json"
          git fetch origin main
          git checkout -B manifest-sync origin/main
          mkdir -p updater
          cp "$RUNNER_TEMP/latest.json" updater/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest ${{ steps.version.outputs.value }}"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "raw updater manifest pushed"
                break
              fi
              echo "push attempt $attempt failed; rebasing"
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 5
            done
            git push origin HEAD:main
          fi

      - name: Dispatch Gitee mirror sync
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=sync-gitee
