name: Release Rust app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: wxbns
      GITEE_REPO: seraphine-rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/app/src-tauri

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content rust/app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Run release tests
        working-directory: rust
        run: cargo test --release --workspace

      - name: Install frontend dependencies
        working-directory: rust/app
        run: npm ci

      - name: Build signed installer
        working-directory: rust/app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Build Chinese installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }
          & $iscc "installer\seraphine-rust.iss"
          $zh = "installer\Output\SeraphineRust-${{ steps.version.outputs.value }}-setup-zh.exe"
          if (-not (Test-Path $zh)) { throw "Chinese installer not found: $zh" }

      - name: Build latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dry-run" }
          $installer = "rust/app/src-tauri/target/release/bundle/nsis/Seraphine Rust_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $encoded = "Seraphine.Rust_${version}_x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$encoded"
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          python rust/app/scripts/make_latest_json.py `
            --installer $installer `
            --signature "$installer.sig" `
            --version $version `
            --url $url `
            --notes "Seraphine Rust $version" `
            --pub-date $timestamp `
            --output latest.json

      - name: Prepare Gitee assets
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "gitee-assets" | Out-Null
          Copy-Item "rust/app/src-tauri/target/release/bundle/nsis/Seraphine Rust_${version}_x64-setup.exe" "gitee-assets/Seraphine.Rust_${version}_x64-setup.exe"
          Copy-Item "rust/app/src-tauri/target/release/bundle/nsis/Seraphine Rust_${version}_x64-setup.exe.sig" "gitee-assets/Seraphine.Rust_${version}_x64-setup.exe.sig"
          Copy-Item "installer/Output/SeraphineRust-${version}-setup-zh.exe" "gitee-assets/"
          Copy-Item "app/resource/data/AramBuff.json" "gitee-assets/"
          Copy-Item "app/resource/data/aram-manifest.json" "gitee-assets/"
          python scripts/make_gitee_latest.py `
            --input latest.json `
            --url "https://gitee.com/wxbns/seraphine-rust/releases/download/$tag/Seraphine.Rust_${version}_x64-setup.exe" `
            --output "gitee-assets/latest.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-rust-${{ steps.version.outputs.value }}
          path: |
            rust/app/src-tauri/target/release/bundle/nsis/*.exe
            rust/app/src-tauri/target/release/bundle/nsis/*.sig
            installer/Output/*.exe
            app/resource/data/AramBuff.json
            app/resource/data/aram-manifest.json
            latest.json
            gitee-assets/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Seraphine Rust ${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            rust/app/src-tauri/target/release/bundle/nsis/*.exe
            rust/app/src-tauri/target/release/bundle/nsis/*.sig
            installer/Output/*.exe
            app/resource/data/AramBuff.json
            app/resource/data/aram-manifest.json
            latest.json

      - name: Publish updater manifest
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater
          name: Updater manifest
          body: Tauri updater manifest (latest.json) for the newest application release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: latest.json

      - name: Install Gitee publisher dependency
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        run: python -m pip install --quiet requests

      - name: Sync tag to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          GIT_TERMINAL_PROMPT=0 git push \
            "https://wxbns:${GITEE_TOKEN}@gitee.com/wxbns/seraphine-rust.git" \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Publish app release to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          python scripts/publish_gitee_assets.py \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" \
            --tag "$GITHUB_REF_NAME" \
            --release-name "Seraphine Rust ${{ steps.version.outputs.value }}" \
            --release-body "GitHub 构建，Gitee 下载与更新。包含中文 Inno Setup 安装包、自动更新包与 ARAM 数据。" \
            --target main \
            --files gitee-assets/*

      - name: Publish updater manifest to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          python scripts/publish_gitee_assets.py \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" \
            --tag updater \
            --release-name "Updater manifest" \
            --release-body "Tauri updater manifest (Gitee download)." \
            --target main \
            --files gitee-assets/latest.json

      - name: Publish ARAM data to Gitee
        if: github.ref_type == 'tag' && env.GITEE_TOKEN != ''
        shell: bash
        run: |
          python scripts/publish_gitee_assets.py \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" \
            --tag aram-data-latest \
            --release-name "ARAM data (latest)" \
            --release-body "Automated ARAM balance snapshot (wiki.leagueoflegends.com, CC BY-SA 3.0)." \
            --target main \
            --files app/resource/data/AramBuff.json app/resource/data/aram-manifest.json