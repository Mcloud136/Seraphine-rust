name: Update ARAM data

on:
  schedule:
    # Wiki data is refreshed by editors after LoL patches (Wed/Thu/Fri).
    - cron: "0 9 * * 3,4,5"
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/update_aram_data.yaml
      - rust/tools/aram-data/**
      - rust/tools/release/**
      - rust/Cargo.lock

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: wxbns
      GITEE_REPO: seraphine-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release tool
        run: cargo build --release --manifest-path rust/Cargo.toml -p release-tool

      - name: Generate ARAM data snapshot
        run: cargo run --release --manifest-path rust/Cargo.toml -p aram-data -- --output-dir rust/resources/data

      - name: Commit snapshot
        run: |
          if git diff --quiet -- rust/resources/data; then
            echo "ARAM data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rust/resources/data
          git commit -m "chore: update ARAM data snapshot"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" &&
              git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=1
              break
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "failed to publish ARAM snapshot to $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Report snapshot
        run: |
          rust/target/release/release-tool aram-report \
            --manifest rust/resources/data/aram-manifest.json

      - name: Publish assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aram-data-latest
          name: ARAM data (latest)
          body: Automated ARAM balance snapshot (wiki.leagueoflegends.com, CC BY-SA 3.0).
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            rust/resources/data/AramBuff.json
            rust/resources/data/aram-manifest.json

      - name: Publish assets to Gitee
        if: env.GITEE_TOKEN != ''
        run: |
          rust/target/release/release-tool gitee \
            --owner "$GITEE_OWNER" \
            --repo "$GITEE_REPO" \
            --tag aram-data-latest \
            --release-name "ARAM data (latest)" \
            --release-body "Automated ARAM balance snapshot (wiki.leagueoflegends.com, CC BY-SA 3.0)." \
            --target main \
            --files rust/resources/data/AramBuff.json rust/resources/data/aram-manifest.json