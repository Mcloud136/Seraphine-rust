[package]
name = "seraphine-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "seraphine-sidecar"
path = "src/main.rs"

[[bin]]
name = "seraphine-updater"
path = "src/bin/updater.rs"

[dependencies]
seraphine-automation = { path = "../crates/automation" }
seraphine-domain = { path = "../crates/domain" }
seraphine-lcu = { path = "../crates/lcu" }
seraphine-platform = { path = "../crates/platform" }
seraphine-protocol = { path = "../crates/protocol" }
seraphine-resource-scheduler = { path = "../crates/resource_scheduler" }
reqwest = { version = "0.12", default-features = false }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }
zeroize = "1"
