[package]
name = "seraphine-lcu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
futures-util = "0.3"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
seraphine-resource-scheduler = { path = "../resource_scheduler" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
zeroize = "1"

[dev-dependencies]
seraphine-platform = { path = "../platform" }
