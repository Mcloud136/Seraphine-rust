[package]
name = "seraphine-winui3-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "seraphine-winui3-sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
windows-reactor = { package = "windows-reactor-pre", version = "0.108.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.4.9"

[build-dependencies]
windows-reactor-setup = "0.100.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
